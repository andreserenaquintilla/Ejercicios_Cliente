<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Días para fin de curso</title>
</head>
<body>

  <h1>Cuenta atrás para fin de curso</h1>
  <p id="resultado"></p>

  <script>
    // Fecha de hoy
    const hoy = new Date();

    // Fecha de cuando empiezan las prácticas: 1 de Marzo (mes 2 porque enero = 0)
    const inicioPracticas = new Date(hoy.getFullYear(), 2, 1);

    // Fecha de fin de curso: 24 de junio (mes 5 porque enero = 0)
    const finCurso = new Date(hoy.getFullYear(), 5, 24);

    // Si el fin de curso ya pasó este año, lo pasamos al año siguiente
    if (hoy > finCurso) {
      finCurso.setFullYear(hoy.getFullYear() + 1);
    }
    if (hoy > inicioPracticas) {
      inicioPracticas.setFullYear(hoy.getFullYear() + 1);
    }

    // Diferencia en milisegundos -> días
    const msPorDia = 1000 * 60 * 60 * 24;
    const diasRestantes = Math.ceil((finCurso - hoy) / msPorDia);
    const diasRestantesPracticas = Math.ceil((inicioPracticas - hoy) / msPorDia);

    document.getElementById("resultado").textContent =
      `Quedan ${diasRestantes} días para el fin de curso y ${diasRestantesPracticas} días para el inicio de las prácticas.`;
  </script>

</body>
</html>
